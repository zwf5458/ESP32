<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 · 无线网络安全教学与管理后台</title>
<style>
:root{
  --bg:#f5f0e8; --ink:#111; --cream:#faf3e3; --yellow:#ffe14d; --yellow-bd:#f5d943;
  --orange:#ffa14d; --pink:#ff9ecf; --blue:#7fd9ff; --purple:#b7a4ff;
  --red-bg:#ffb3ab; --green-bg:#b9f0ae; --ok:#35c04a;
  --bd:3px solid #111; --sh:4px 4px 0 #111; --sh2:2px 2px 0 #111; --r:14px;
}
html[data-theme=dark]{--bg:#17140f;--ink:#f5efe4;--cream:#241f18;--yellow:#6b5615;--yellow-bd:#5c4a12;
  --orange:#7a4d1c;--pink:#4d2738;--blue:#1d4258;--purple:#3a2f66;--red-bg:#4d2723;--green-bg:#26451f;--sh:4px 4px 0 #000;--sh2:2px 2px 0 #000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC",-apple-system,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;padding-top:58px}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
/* ---------- topbar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:9px 14px;background:var(--yellow-bd);border-bottom:var(--bd)}
#burger{width:42px;height:42px;display:grid;place-items:center;gap:5px;cursor:pointer;
  background:var(--cream);border:var(--bd);border-radius:12px;box-shadow:var(--sh);flex:0 0 auto}
#burger .l{display:block;width:20px;height:3px;background:#111;border-radius:2px}
html[data-theme=dark] #burger .l{background:#f5efe4}
#burger.bx .l1{transform:translateY(8px) rotate(45deg)}
#burger.bx .l2{opacity:0}
#burger.bx .l3{transform:translateY(-8px) rotate(-45deg)}
#topbar h1{margin:0;font-size:16px;font-weight:900;font-family:"SF Mono",Menlo,monospace;flex:1;letter-spacing:.5px}
.tp-pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:var(--bd);border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:800;box-shadow:var(--sh2)}
#tpTheme{cursor:pointer}
.memb{width:74px;height:10px;border:2px solid #111;border-radius:4px;overflow:hidden;background:#fff}
.memb i{display:block;height:100%;background:#35c04a}
/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:#0009;z-index:40;display:none}
#drawer{position:fixed;top:0;left:-290px;bottom:0;width:280px;z-index:45;background:var(--cream);
  border-right:var(--bd);transition:left .18s;overflow-y:auto;padding:0 0 24px}
#drawer.open{left:0}
.dr-header{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:var(--bd)}
#drBurgerClose{width:40px;height:40px;display:grid;place-items:center;gap:4px;cursor:pointer;
  background:var(--cream);border:var(--bd);border-radius:12px;box-shadow:var(--sh);flex:0 0 auto;padding:9px 7px}
#drBurgerClose .l{display:block;width:22px;height:3.5px;background:#111;border-radius:2px}
.dr-chip{width:38px;height:38px;display:grid;place-items:center;background:#ff85c0;border:var(--bd);border-radius:10px;box-shadow:var(--sh2);flex:0 0 auto}
.dr-title{font-size:19px;font-weight:900;letter-spacing:1px;color:#111}
.dr-sec{font-size:12px;font-weight:900;color:#111;padding:14px 18px 6px;letter-spacing:0.5px}
.dr-item{display:flex;align-items:center;gap:12px;padding:10px 18px;font-size:14.5px;font-weight:800;
  cursor:pointer;border:none;color:#111;transition:background .12s;user-select:none}
.dr-item:hover{background:#0000000a}
.dr-item.on{background:var(--orange);color:#111;font-weight:900;border-radius:0;box-shadow:none}
.dr-item.dis{opacity:.5;cursor:not-allowed}
.dr-svg{width:18px;height:18px;display:inline-block;flex:0 0 18px;vertical-align:middle}
.dr-glyph{width:18px;display:inline-grid;place-items:center;font-size:16px;flex:0 0 18px;line-height:1}
.dr-lang-row{display:flex;align-items:center;gap:10px;padding:6px 18px 12px}
.dr-lang-dot{font-size:16px;color:#111;line-height:1;margin-left:2px}
.dr-lang-select{flex:1;background:var(--cream);color:#111;border:var(--bd);border-radius:10px;
  padding:7px 12px;font-weight:900;font-size:13.5px;font-family:inherit;box-shadow:var(--sh2);cursor:pointer}
html[data-theme=dark] .dr-lang-select{background:#2a2a2a;color:#fff}
html[data-theme=dark] #drBurgerClose{background:#2a2a2a}
html[data-theme=dark] #drBurgerClose .l{background:#fff}
html[data-theme=dark] .dr-item{color:var(--ink)}
html[data-theme=dark] .dr-sec{color:var(--ink)}
html[data-theme=dark] .dr-lang-dot{color:var(--ink)}
html[data-theme=dark] .dr-title{color:var(--ink)}
/* ---------- cards ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--cream);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:900;text-align:center;letter-spacing:.5px}
.banner{background:var(--yellow);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);
  padding:22px;text-align:center;margin-bottom:18px}
.banner.big{font-size:30px;font-weight:900;letter-spacing:2px}
.banner .chip-st{display:inline-block;background:#000;color:#ffe14d;border-radius:6px;padding:2px 10px;
  font-size:12px;font-weight:800;margin-top:6px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}
.g3a{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g3,.g3a{grid-template-columns:1fr}}
.mod{padding:18px 10px;text-align:center;font-weight:900;font-size:15px;border-radius:var(--r)}
.mod small{display:block;margin-top:6px;font-weight:900;color:#5b4d17}
html[data-theme=dark] .mod small{color:#cbb977}
.mod.o{background:var(--orange)} .mod.p{background:var(--pink)} .mod.y{background:var(--yellow)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px dashed #0003;font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:#8a7f6d;font-weight:700}
.kv .v{font-weight:900;font-family:"SF Mono",Menlo,monospace}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.btn{border:var(--bd);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:900;cursor:pointer;
  color:#111;box-shadow:var(--sh);background:var(--yellow);transition:transform .06s,box-shadow .06s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #111}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.red{background:#ff7f6e}.btn.green{background:var(--green-bg)}.btn.pinkbg{background:var(--pink)}
.btn.purplebg{background:var(--purple)}.btn.gray{background:#dcd4c4}
.btn.sm{padding:7px 14px;font-size:12.5px;border-radius:10px;box-shadow:var(--sh2)}
.diag{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.diag{grid-template-columns:1fr 1fr}}
.dg{border:var(--bd);border-radius:12px;padding:12px;text-align:center;font-weight:900}
.dg b{display:block;font-size:22px;font-family:"SF Mono",Menlo,monospace}
.dg small{color:#5b4d17;font-weight:800}
html[data-theme=dark] .dg small{color:#cbb977}
.dg.v{background:var(--purple)} .dg.o{background:var(--orange)} .dg.y{background:var(--yellow)} .dg.p{background:var(--pink)}
/* ---------- 邪恶双子攻击页 ---------- */
.grid.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.grid.g4{grid-template-columns:1fr 1fr}}
.card.solid-orange{background:var(--orange)}
.flbl{display:block;font-weight:900;font-size:12px;margin-bottom:4px;color:#4a3612}
.grid.g4 input,.grid.g4 select{width:100%;box-sizing:border-box;padding:8px 10px;border:var(--bd);border-radius:10px;
  font-weight:800;font-size:13.5px;background:#fff;color:#111;font-family:inherit}
html[data-theme=dark] .grid.g4 input,html[data-theme=dark] .grid.g4 select{background:#2a2a2a;color:#fff}
.twin-row{display:flex;align-items:center;gap:10px;background:#121212;color:#ffe14d;border:var(--bd);
  border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.twin-row .tr-ssid{flex:1 1 140px;font-weight:900;color:#fff}
.twin-row .tr-mac{flex:1 1 160px;color:#9adcff}
.twin-row .tr-ch{flex:0 0 90px;color:#ffe14d}
.twin-row .btn{margin-left:auto}
.tag-fake{background:#ff7f6e;color:#111;border-radius:6px;padding:1px 6px;font-size:11px}
.badge-ok{position:absolute;right:14px;top:-2px;background:#33cc66;border:var(--bd);border-radius:8px;
  padding:2px 10px;font-size:11px;font-weight:900}
.card.rel{position:relative}
.legal{background:var(--red-bg)}
.legal h3{text-align:left}
.legal li{font-size:12.5px;margin:5px 0}
.logc{background:#0a0a0a;color:#33ff66;font-family:"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.7;
  padding:12px 14px;border-radius:10px;height:170px;overflow-y:auto;white-space:pre-wrap;border:var(--bd)}
/* ---------- scan & tables ---------- */
.scanband{background:#1b1b1b;border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);
  padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;position:relative}
.scanband .st{color:#ffe14d;font-size:12px;font-weight:800;font-family:"SF Mono",Menlo,monospace}
.filters{display:flex;gap:8px;align-items:center;color:#111;background:var(--cream);border:var(--bd);
  border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800}
.filters label{cursor:pointer;display:flex;align-items:center;gap:3px}
.table-wrap{border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;background:#fff;margin-bottom:18px}
html[data-theme=dark] .table-wrap{background:#1b1b1b}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--yellow);padding:10px;font-weight:900;text-align:left;border-bottom:var(--bd);color:#111}
td{padding:8px 10px;border-bottom:1px solid #ddd}
html[data-theme=dark] td{border-bottom-color:#333}
tr:hover td{background:#0000000a}
.hidden-ssid{color:#8a7f6d;font-style:italic}
.tbtn{border:2px solid #111;background:var(--yellow);padding:3px 10px;border-radius:6px;font-weight:900;font-size:12px;cursor:pointer;color:#111;transition:transform .05s}
.tbtn:hover{transform:translate(-1px,-1px)}
.tbtn.pink{background:var(--pink)} .tbtn.yellow{background:var(--yellow)} .tbtn.purple{background:var(--purple)}
.tbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.frow{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.frow label{width:110px;font-weight:800;color:#8a7f6d}
.frow .val{font-weight:900;font-family:"SF Mono",Menlo,monospace}
.frow input[type=text], .frow select{background:#fff;color:#111;font-weight:700;font-size:14px;
  border:var(--bd);border-radius:10px;padding:8px 14px;flex:1;min-width:180px}
html[data-theme=dark] .frow input[type=text], html[data-theme=dark] .frow select{background:#2a2a2a;color:#fff}
select.mini{padding:8px 12px;font-weight:800;border:var(--bd);border-radius:10px;background:var(--yellow);font-family:inherit}
.note{font-size:12px;color:#8a7f6d;margin-top:6px}
.attack-banner{background:var(--yellow);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;
  font-size:13px;font-weight:700;margin-bottom:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;background:#111;color:#ffe14d;
  border:var(--bd);border-radius:12px;padding:10px 18px;font-weight:900;box-shadow:var(--sh);display:none}

/* ---------- 3大板块专属样式 ---------- */
.status-pill{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:900;font-size:12px;border:2px solid #111}
.status-pill.run{background:#35c04a;color:#111}
.status-pill.idle{background:#ccc;color:#333}
.pbar-wrap{border:3px solid #111;background:#fff;border-radius:10px;height:24px;overflow:hidden;position:relative;margin:10px 0}
.pbar-fill{background:repeating-linear-gradient(45deg,#ffe14d,#ffe14d 10px,#ffa14d 10px,#ffa14d 20px);height:100%;width:0%;transition:width .2s}
.pbar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;font-family:"SF Mono",monospace}
.step-nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media(max-width:700px){.step-nodes{grid-template-columns:1fr 1fr}}
.step-node{border:var(--bd);border-radius:10px;padding:10px;text-align:center;font-weight:800;background:#eee}
.step-node.active{background:#35c04a;color:#111;box-shadow:var(--sh2)}
.step-node small{display:block;font-size:10px;margin-top:4px}
</style>
</head>
<body>

<!-- ===== TOPBAR ===== -->
<div id="topbar">
  <div id="burger"><span class="l l1"></span><span class="l l2"></span><span class="l l3"></span></div>
  <h1 id="pageTitle">状态总览</h1>
  <div class="tp-pill" id="tpTheme">☀️</div>
  <div class="tp-pill">运行时间 <span class="mono" id="up">00:00:00</span></div>
  <div class="tp-pill">内存 <div class="memb"><i id="memBar" style="width:0%"></i></div> <span class="mono" id="memTxt">--%</span></div>
</div>

<!-- ===== DRAWER ===== -->
<div id="scrim"></div>
<aside id="drawer">
  <div class="dr-header">
    <div id="drBurgerClose" onclick="toggleDrawer(false)" title="收起菜单">
      <span class="l"></span><span class="l"></span><span class="l"></span>
    </div>
    <div class="dr-chip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2">
        <rect x="5" y="5" width="14" height="14" rx="2" fill="#fff"/>
        <rect x="8" y="8" width="8" height="8" rx="1" fill="#ff85c0"/>
        <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
      </svg>
    </div>
    <span class="dr-title">ESP32</span>
  </div>

  <div class="dr-sec">仪表板</div>
  <div class="dr-item on" data-page="dash"><span class="dr-glyph">☼</span> 状态总览</div>
  <div class="dr-lang-row">
    <span class="dr-lang-dot">●</span>
    <select class="dr-lang-select">
      <option>中文</option>
      <option disabled>English (暂未开放)</option>
    </select>
  </div>

  <div class="dr-sec">WIFI模块</div>
  <div class="dr-item" data-page="packet">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    数据包分析器
  </div>
  <div class="dr-item" data-page="airodump">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16l7.36-5.73L21 9.07l-9-7-9 7 1.63 1.2L12 16z"/><path d="M12 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74z"/></svg>
    Airodump侦察
  </div>
  <div class="dr-item" data-page="scan">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9.47 2.01-12.73 5.27l1.41 1.41C3.32 6.95 7.42 5.1 12 5.1s8.68 1.85 11.32 4.58l1.41-1.41C21.47 5.01 16.97 3 12 3zm0 4.2c-3.81 0-7.26 1.54-9.76 4.04l1.41 1.41C5.81 10.49 8.74 9.3 12 9.3s6.19 1.19 8.35 3.35l1.41-1.41C19.26 8.74 15.81 7.2 12 7.2zm0 4.2c-2.65 0-5.06 1.07-6.79 2.81l1.41 1.41C7.88 14.36 9.82 13.5 12 13.5s4.12.86 5.38 2.12l1.41-1.41C17.06 12.47 14.65 11.4 12 11.4zm0 4.2c-1.49 0-2.85.61-3.82 1.58l3.82 3.82 3.82-3.82C14.85 16.21 13.49 15.6 12 15.6z"/></svg>
    扫描与嗅探
  </div>
  <div class="dr-item" data-page="eviltwin">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    邪恶双子攻击
  </div>
  <div class="dr-item" data-page="karma">
    <span class="dr-glyph" style="font-size:18px;font-weight:900">↕</span>
    Karma攻击
  </div>
  <div class="dr-item" data-page="deauth">
    <span class="dr-glyph" style="font-size:14px">⬤</span>
    取消认证器
  </div>

  <div class="dr-sec" id="navLpSec">低功耗无线</div>
  <div class="dr-item" data-page="ble" id="navBle">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
    BLE 扫描
  </div>
  <div class="dr-item" data-page="ieee" id="navI154">
    <span class="dr-glyph" style="font-size:15px">≋</span>
    802.15.4 扫描
  </div>

  <div class="dr-sec">系统</div>
  <div class="dr-item" data-page="creds">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    捕获的凭据
  </div>
  <div class="dr-item" data-page="cfg">
    <svg class="dr-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    配置
  </div>
</aside>

<main id="view"></main>
<div id="toast"></div>

<script src="/vendor-db.js"></script>
<script>
/* ================== helpers ================== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const toast = msg => {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', 2400);
};
const fmtBytes = b => {
  if (b == null) return '--';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(2) + ' MB';
};
const fmtUp = s => {
  if (s == null) return '--';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
};
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
function fragPct(free, maxBlock) { return free > 0 ? Math.max(0, (100 - 100 * maxBlock / free)).toFixed(0) : '--'; }

/* ---------- 双频信道 (P0: 5GHz 仅 C5) ---------- */
const CHANNELS_5G = [36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144,149,153,157,161,165];
const is5gCh = ch => Number(ch) > 14;
const isDfs5g = ch => ch >= 52 && ch <= 144;
const has5g = () => !!(state.info && state.info.band5g);

// Sniffer / Airodump 共用的信道下拉: 跳频项 + 2.4G / 5G 分组 (5G 仅在 C5 显示)
function channelSelectOptions(cur, hopping, hopBand) {
  const c = Number(cur) || 6;
  const h24 = hopping && hopBand !== 5;
  let h = `<option value="hop24" ${h24 ? 'selected' : ''}>全信道跳频 (2.4G 1-13)</option>`;
  if (has5g()) h += `<option value="hop5" ${hopping && hopBand === 5 ? 'selected' : ''}>全信道跳频 (5G)</option>`;
  h += `<optgroup label="2.4GHz">` + Array.from({ length: 13 }, (_, i) => i + 1).map(ch =>
    `<option value="${ch}" ${(!hopping && c === ch) ? 'selected' : ''}>信道 ${ch}</option>`).join('') + `</optgroup>`;
  if (has5g()) {
    h += `<optgroup label="5GHz (C5)">` + CHANNELS_5G.map(ch =>
      `<option value="${ch}" ${(!hopping && c === ch) ? 'selected' : ''}>信道 ${ch}${isDfs5g(ch) ? ' (DFS)' : ''}</option>`).join('') + `</optgroup>`;
  }
  return h;
}

// 从下拉值生成启动请求体; hop24/hop5 表示跳频, 数字表示停驻
function channelStartBody(val, skipDfs) {
  if (val === 'hop24') return { hopping: true, band: '24', skipDfs };
  if (val === 'hop5') return { hopping: true, band: '5', skipDfs };
  return { channel: parseInt(val, 10), hopping: false, skipDfs };
}

const band5gNote = () => has5g()
  ? `<div class="note" style="color:#e67e22;font-weight:700">5G 仅 C5 支持: 抓包驻留/跳频 5G 时单射频热点会同步切到 5G 或短暂离线, 浏览器可能掉线; 串口控制台始终可用。</div>`
  : '';

async function api(path, opts = {}) {
  const r = await fetch(path, withAdminAuth(opts));
  if (r.status === 401) {
    showLogin('口令已失效，请重新登录');
    throw new Error('未授权: 请输入后台口令');
  }
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

/* ---------- 后台口令 (localStorage) ---------- */
const adminToken = () => localStorage.getItem('adminToken') || '';
function withAdminAuth(opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const t = adminToken();
  if (t) headers['X-Admin-Token'] = t;
  opts.headers = headers;
  return opts;
}
function showLogin(msg) {

let scanFlag = false;
async function realScan() {
  if (scanFlag) return; scanFlag = true;
  const st = $('#scanStatus');
  if (st) st.textContent = '正在扫描周围无线信道 …';
  const btn = $('#btnScan');
  if (btn) btn.disabled = true;
  try {
    const j = await api('/api/scan');
    state.scan = j.networks || [];
    log('[scan] 扫描完成: 共发现 ' + state.scan.length + ' 个 AP', 't-ok');
    if (st) st.textContent = state.scan.length + ' 个 AP 点击列表标题排序';
  } catch (e) {
    if (st) st.textContent = '扫描失败: ' + e.message;
  }
  scanFlag = false;
  if (btn) btn.disabled = false;
  paintScan();
}

function sortScan(key) {
  if (state.scanSort.key === key) {
    state.scanSort.asc = !state.scanSort.asc;
  } else {
    state.scanSort.key = key;
    state.scanSort.asc = (key === 'ssid' || key === 'auth' || key === 'bssid');
  }
  paintScan();
}

function passFilter(n) {
  const f = state.filter;
  if (f === '24' && n.channel > 14) return false;
  if (f === '5' && n.channel <= 14) return false;
  if (!state.showHidden && n.hidden) return false;
  return true;
}

function paintScan() {
  const tb = $('#tbody'); if (!tb) return;
  const { key, asc } = state.scanSort || { key: 'rssi', asc: false };
  const filtered = state.scan.filter(passFilter);
  const list = filtered.slice().sort((a, b) => {
    let va = a[key], vb = b[key];
    if (key === 'ssid') {
      va = (a.ssid || '').toLowerCase();
      vb = (b.ssid || '').toLowerCase();
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return (b.rssi || 0) - (a.rssi || 0);
  });

  const arrow = col => (state.scanSort?.key === col ? (state.scanSort.asc ? ' ▲' : ' ▼') : '');
  const thRow = $('#scanThead');
  if (thRow) {
    thRow.innerHTML = `<tr>
      <th style="cursor:pointer" onclick="sortScan('ssid')">SSID${arrow('ssid')}</th>
      <th style="cursor:pointer" onclick="sortScan('rssi')">RSSI${arrow('rssi')}</th>
      <th style="cursor:pointer" onclick="sortScan('channel')">信道${arrow('channel')}</th>
      <th style="cursor:pointer" onclick="sortScan('bssid')">BSSID${arrow('bssid')}</th>
      <th style="cursor:pointer" onclick="sortScan('auth')">安全${arrow('auth')}</th>
      <th>操作</th>
    </tr>`;
  }

  const st = $('#scanStatus');
  if (st && !scanFlag) {
    st.textContent = state.scan.length ? `${state.scan.length} 个 AP 点击列表标题排序` : '尚未扫描 — 点「开始扫描」';
  }

  tb.innerHTML = list.length ? list.map((n, idx) => `
    <tr>
      <td class="ssid ${n.hidden ? 'hidden-ssid' : ''}" style="font-weight:900;color:var(--yellow)">${n.hidden ? '(隐藏网络)' : esc(n.ssid)}</td>
      <td class="rssi mono" style="color:#4cd964;font-weight:900">${n.rssi}</td>
      <td class="mono" style="color:#ffe14d;font-weight:800">${n.channel}</td>
      <td class="mono" style="font-size:12px">${esc(n.bssid)}</td>
      <td class="mono" style="font-size:12px">${esc(n.auth || 'OPEN')}</td>
      <td style="white-space:nowrap">
        <button class="tbtn pink" ${state.target && state.target.bssid === n.bssid ? 'disabled' : ''}
          title="设为主目标 (${is5gCh(n.channel) ? (has5g() ? (isDfs5g(n.channel) ? '5G DFS · 不能克隆, 请用双子' : '5G · 克隆热点与持续 Deauth') : '本芯片不支持 5G') : '2.4G · 克隆热点与持续 Deauth'})"
          onclick='pickTarget(${JSON.stringify({ssid:n.ssid,bssid:n.bssid,channel:n.channel,rssi:n.rssi,auth:n.auth}).replace(/'/g,"&#39;")}, "primary")'>目标</button>
        <button class="tbtn yellow" style="margin-left:6px" ${(state.info?.twins || []).some(x => x.bssid === n.bssid) ? 'disabled' : ''}
          title="设为双子 (5G/多频 · 跳频注入/假 AP)"
          onclick='pickTarget(${JSON.stringify({ssid:n.ssid,bssid:n.bssid,channel:n.channel,rssi:n.rssi,auth:n.auth}).replace(/'/g,"&#39;")}, "twin")'>+双子</button>
      </td>
    </tr>`).join('') : `<tr><td colspan="6" class="nores" style="text-align:center;padding:20px;color:#888">${
      state.scan.length ? '无对应频段结果' : '尚未扫描 — 点「开始扫描」'}</td></tr>`;
}

async function pickTarget(t, role) {
  role = role || 'primary';
  // 主目标要起同名克隆热点: 2.4G 1-14 (全芯片) 或 5G 非 DFS (仅 C5)。
  // DFS 信道 (52-144) 需雷达检测 (CAC), softAP 无法驻留 → 引导改用双子跳频压制。
  if (role === 'primary' && is5gCh(t.channel)) {
    if (!has5g()) {
      toast('本芯片仅支持 2.4G — 5G 信号请点「+双子」');
      log('[target] 拒绝: ' + (t.ssid || t.bssid) + ' 在 5G 信道 ' + t.channel + ', 本芯片不支持 5G', 't-warn');
      return;
    }
    if (isDfs5g(t.channel)) {
      toast('主目标在 5G DFS 信道 (52-144): 克隆热点无法驻留 DFS — 请点「+双子」改用跳频压制');
      log('[target] 拒绝: ' + (t.ssid || t.bssid) + ' 在 5G DFS 信道 ' + t.channel + ', 不能作为主目标', 't-warn');
      return;
    }
  }
  try {
    if (role === 'twin') {
      await api('/api/twin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({}, t, { fakeAp: 'false' })) });
      log('[twin] 已加入双子目标: ' + (t.ssid || '(隐藏)') + ' @ ' + t.bssid + ' 信道' + t.channel);
      toast('已加入双子目标: ' + (t.ssid || t.bssid));
      await pollInfo(); paintScan();
      toast('已加入双子目标 (共 ' + ((state.info?.twins || []).length) + ' 条)');
    } else {
      await api('/api/target', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) });
      state.target = t;
      log('[target] 已设置主目标: ' + (t.ssid || '(隐藏)') + ' @ ' + t.bssid + ' 信道' + t.channel);
      toast('已设置主目标: ' + (t.ssid || t.bssid));
      go('eviltwin');
    }
  } catch (e) {
    let msg = e.message; try { msg = JSON.parse(e.message).error || msg; } catch (_) {}
    toast('设置失败: ' + msg);
  }
}

function etLiveHtml(et = {}, de = {}, clients = 0) {

      <span class="status-pill ${clients ? 'run' : 'idle'}">已接入设备: ${clients ?? 0} 台</span>`;
}
function etUpdateLive() {
  const i = state.info; if (!i) return;
  const et = i.evilTwin || {}, de = i.deauth || {};
  const live = $('#etLive'); if (live) live.innerHTML = etLiveHtml(et, de, i.clients);

/* ---------- BLE 扫描 (P2) ---------- */
const bleSupported = () => !(state.info && state.info.ble && state.info.ble.supported === false);

function blePhaseText(b) {
  if (b.initFailed) return '初始化失败';
  switch (b.phase) {
    case 'starting': return '初始化中';
    case 'running': return '扫描中';
    case 'stopping': return '停止中';
    default: return '待命';
  }
}

// lastSeen 是设备侧 millis(), 用 /api/info 的 uptime(秒) 折算相对时间
function bleAge(ms) {
  const up = state.info ? (state.info.uptime || 0) : 0;
  const sec = Math.floor((Number(ms) || 0) / 1000);
  const d = up - sec;
  if (d <= 1) return '刚刚';
  if (d < 60) return d + ' 秒前';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  return Math.floor(d / 3600) + ' 小时前';
}

function bleRssi(r) {
  const v = Number(r) || -127;
  const c = v >= -60 ? '#35c04a' : (v >= -80 ? '#e0a800' : '#d9534f');
  return `<b style="color:${c}">${v}</b>`;
}

/* ---------- P4: 厂商 / 类型名称 (vendor_db.js, 缺失时优雅降级) ---------- */
const vdb = () => window.VENDOR_DB || null;
const hexNum = (v, pad) => v ? '0x' + Number(v).toString(16).toUpperCase().padStart(pad, '0') : '';
function bleCompanyName(id) {
  const db = vdb();
  return (id && db && db.company && db.company[id]) || '';
}
function bleServiceName(id) {
  const db = vdb();
  return (id && db && db.service && db.service[id]) || '';
}
function bleClassLabel(cls) {
  const db = vdb();
  if (db && db.classes && db.classes[cls]) return db.classes[cls];
  return cls ? '类别 ' + cls : '未知';
}
function bleVendorCell(d) {
  const cid = d.companyId || 0;
  const cls = d.devClass || 0;
  const company = bleCompanyName(cid);
  const svc = bleServiceName(d.svcUuid);
  let h = `<span class="status-pill ${cls ? 'run' : 'idle'}" style="font-size:11px">${esc(bleClassLabel(cls))}</span>`;
  h += `<div style="margin-top:3px"><b>${cid ? esc(company || hexNum(cid, 4)) : '—'}</b>`;
  if (d.svcUuid) h += `<span style="color:#888;font-size:11px"> / ${esc(svc || hexNum(d.svcUuid, 4))}</span>`;
  h += '</div>';
  if (d.randomMac) h += '<div style="color:#888;font-size:11px">随机 MAC</div>';
  return h;
}

function blePaintRows(list) {

  tb.innerHTML = rows.map(d => {

    return `<tr>
      <td><code style="font-size:12px">${esc(d.mac)}</code></td>
      <td>${name}</td>
      <td style="white-space:nowrap">${bleRssi(d.rssi)} <small style="color:#888">dBm</small></td>

      <td>${d.advCount || 0}</td>

}

/* ---------- 802.15.4 扫描 (P3) ---------- */
const i154Supported = () => !(state.info && state.info.ieee802154 && state.info.ieee802154.supported === false);

function i154PhaseText(s) {
  if (s.initFailed) return '初始化失败';
  switch (s.phase) {
    case 'starting': return '初始化中';
    case 'running': return '扫描中';
    case 'stopping': return '停止中';
    default: return '待命';
  }
}

// 802.15.4 信道 11-26 → 中心频率 2405 + 5*(ch-11) MHz
const i154Freq = ch => 2405 + 5 * (ch - 11);
// WiFi 2.4G 信道 20MHz 带宽，与 2MHz 的 802.15.4 信道重叠判断
function i154Overlap(ch, ap) {
  if (!ap || ap < 1 || ap > 14 || !ch) return false;
  return Math.abs(i154Freq(ch) - (2407 + 5 * ap)) < 11;
}

function i154EdBars(s) {
  const ed = s.ed || [];
  return Array.from({ length: 16 }, (_, i) => {
    const ch = 11 + i;
    const v = ed[i];
    const known = typeof v === 'number' && v !== 127;
    const pct = known ? Math.max(0, Math.min(100, Math.round(v + 100))) : 0;
    const color = !known ? '#ddd' : (v > -55 ? '#d9534f' : (v > -75 ? '#e0a800' : '#35c04a'));
    const hot = i154Overlap(ch, s.apChannelActive);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div title="${known ? v + ' dBm' : '未测量'}" style="height:76px;width:100%;display:flex;align-items:flex-end;background:#f2f2f2;border:2px solid ${hot ? '#d9534f' : '#111'};border-radius:4px">
        <div style="height:${pct}%;width:100%;background:${color};transition:height .3s"></div>
      </div>
      <small style="font-size:10px;font-weight:900">${ch}</small>
      <small style="font-size:10px;color:#666">${known ? v : '—'}</small>
    </div>`;
  }).join('');
}

function i154PaintPans(list) {
  const tb = $('#i154PanRows');
  if (!tb) return;
  const rows = (list || []).slice().sort((a, b) => (b.frames || 0) - (a.frames || 0));
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#888;padding:16px">暂无 PAN — 802.15.4 网络会周期性发送 Beacon</td></tr>`;
    return;
  }
  tb.innerHTML = rows.map(p => `<tr>
    <td><code style="font-size:12px">${esc(p.panId)}</code></td>
    <td>${p.channel}</td>
    <td>${bleRssi(p.rssi)} <small style="color:#888">dBm</small></td>
    <td>${p.frames || 0}</td>
    <td style="white-space:nowrap">${bleAge(p.lastSeen)}</td>
  </tr>`).join('');
}

function i154PaintDevs(list) {
  const tb = $('#i154DevRows');
  if (!tb) return;
  const rows = (list || []).slice().sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#888;padding:16px">暂无设备 — 点击「开始扫描」被动接收 802.15.4 帧</td></tr>`;
    return;
  }
  tb.innerHTML = rows.map(d => `<tr>
    <td><code style="font-size:12px">${esc(d.addr)}</code> <small style="color:#888">${d.short ? '短地址' : '扩展'}</small></td>
    <td><code style="font-size:12px">${esc(d.panId)}</code></td>
    <td>${d.channel}</td>
    <td><span class="status-pill idle" style="font-size:11px">${esc(d.type || '—')}</span></td>
    <td style="white-space:nowrap">${bleRssi(d.rssi)} <small style="color:#888">dBm</small></td>
    <td>${d.lqi ?? '—'}</td>
    <td style="white-space:nowrap">${bleAge(d.lastSeen)}</td>
  </tr>`).join('');
}

function i154OverlapNote(s) {
  const ap = s.apChannelActive || s.apChannel;
  if (!ap || ap > 14) return `<span style="color:#35c04a;font-weight:800">AP 工作在 5G，与 802.15.4 不同频段</span>`;
  if (s.hopping) {
    return `<span style="color:#e67e22;font-weight:800">AP 在 2.4G 信道 ${ap}：跳频会周期性扫过 AP 频段，扫到重叠信道时丢帧明显增多</span>`;
  }
  if (i154Overlap(s.channel, ap)) {
    return `<span style="color:#d9534f;font-weight:800">当前 802.15.4 信道 ${s.channel} 与 AP 信道 ${ap} 重叠，抓包率会明显下降</span>`;
  }
  return `<span style="color:#35c04a;font-weight:800">当前 802.15.4 信道 ${s.channel} 与 AP 信道 ${ap} 不重叠</span>`;
}

function i154Update(s) {
  if (!s) return;
  const pill = $('#i154Pill');
  if (pill) {
    pill.className = 'status-pill ' + (s.running ? 'run' : 'idle');

  set('#i154Total', s.total || 0);
  set('#i154Pan', s.panCount || 0);
  set('#i154Dev', s.deviceCount || 0);
  set('#i154Phase', i154PhaseText(s));

  set('#i154Beacon', bt.beacon || 0);
  set('#i154Data', bt.data || 0);
  set('#i154Ack', bt.ack || 0);
  set('#i154Cmd', bt.cmd || 0);
  set('#i154Other', bt.other || 0);
  const ed = $('#i154Ed');
  if (ed) ed.innerHTML = i154EdBars(s);
  const ov = $('#i154Overlap');
  if (ov) ov.innerHTML = i154OverlapNote(s);
  const bs = $('#btnI154Start'), bp = $('#btnI154Stop'), bc = $('#btnI154Clear'), be = $('#btnI154Export');
  if (bs) bs.disabled = !i154Supported() || !!s.running || s.phase === 'starting';
  if (bp) bp.disabled = !i154Supported() || (!s.running && s.phase === 'idle');
  if (bc) bc.disabled = !i154Supported();
  if (be) be.disabled = !i154Supported() || !(s.total || 0);
  ['#i154Mode', '#i154Ch', '#i154Dur'].forEach(sel => { const el = $(sel); if (el) el.disabled = !!s.running; });
  i154PaintPans(s.pans);
  i154PaintDevs(s.devices);
}

    const dur = parseInt($('#i154Dur').value, 10) || 0;
    try {
      await api('/api/ieee802154/start', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, channel: mode === 'energy' ? 0 : ch, duration: dur }) });
      toast('802.15.4 扫描正在启动…');
      log('[i154] 请求开始' + (mode === 'energy' ? '能量扫描' : '帧嗅探') + ' (' + (ch ? '信道 ' + ch : '跳频 11-26') + ')');
      state.i154Status.phase = 'starting';
      i154Update(state.i154Status);
    } catch (e) { toast('启动失败: ' + e.message); }
  };
  $('#btnI154Stop').onclick = async () => {
    try {
      await api('/api/ieee802154/stop', { method: 'POST' });
      toast('802.15.4 扫描正在停止…');
      log('[i154] 请求停止扫描');
      state.i154Status.phase = 'stopping';
      i154Update(state.i154Status);
    } catch (e) { toast('停止失败: ' + e.message); }
  };
  $('#btnI154Clear').onclick = async () => {
    try {
      await api('/api/ieee802154/clear', { method: 'POST' });
      toast('统计与列表已清空');
      Object.assign(state.i154Status, { total: 0, panCount: 0, deviceCount: 0, pans: [], devices: [], byType: {}, ed: [], chFrames: [] });
      i154Update(state.i154Status);

  };
  $('#btnI154Export').onclick = async () => {
    try {
      const d = await api('/api/ieee802154/frames');
      const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);

    } catch (e) { toast('导出失败: ' + e.message); }
  };
  i154Update(s);
}

// 帧注入状态文案: renderDeauth 与 pollModules 共用, 保证两处一致
function deTxModeText(d) {
  if (d.injected === false) return '帧注入: ⚠ 目标 BSSID 格式无效, 不会发送任何帧';
  if (typeof d.txChannel === 'undefined') return '帧注入: esp_wifi_80211_tx (Deauth 管理帧 0x00c0, 广播踢出全部客户端) — 启动后生效';
  if (d.txErr) return `帧注入: ⚠ 最近一次 TX 失败 (错误码 ${d.txErr})`;
  const mismatch = typeof d.txChannel === 'number' && typeof d.channel === 'number' && d.txChannel !== d.channel;
  return `帧注入: esp_wifi_80211_tx @ ch${d.txChannel}${d.channelMoved ? '（已自动对齐目标信道，停止后恢复）' : ''}${d.txOk ? ' · 发送正常' : ' · 等待首帧'}${mismatch ? ' · ⚠ 信道对齐失败，目标可能收不到' : ''}`;
}

function hsErrMsg(e) {
  const raw = String((e && e.message) || e || '请求失败');
  try { const j = JSON.parse(raw); return j.error || raw; } catch (_) { return raw; }
}

    <div class="note">恢复出厂将清除配置并重启; 若设备异常可用此功能复位。</div>

  <div class="attack-banner"><b>教学合规说明:</b> 本设备的所有功能（扫描、邪恶双子演示、Deauth、握手包跑包）仅设计用于局域网安全教学、协议分析与自检测试，严禁用于未授权网络。</div>
  ${legal()}
  <div class="logc" id="logc">[SYSTEM] 就绪。</div>`;
  $('#cfgSsid').value = i.ssid || '';
  $('#cfgMac').textContent = i.mac || '--';
  $('#cfgVer').textContent = i.version || '--';

  $('#btnSaveSsid').onclick = async () => {
    const ssid = $('#cfgSsid').value.trim();
    if (!ssid) { toast('SSID 不能为空'); return; }
    try {
      await api('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid })
      });
      toast(`SSID 已保存为 "${ssid}"，点击「重启设备」后生效`);
    } catch (e) {
      toast('保存失败: ' + e.message);
    }
  };

  $('#cfgCh').onchange = async () => {
    const ch = parseInt($('#cfgCh').value);
    try {
      await api('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel: ch })
      });
      toast(`信道已保存为信道 ${ch} (${ch > 14 ? '5G' : '2.4G'})，点击「重启设备」后生效`);
    } catch (e) {
      toast('保存失败: ' + e.message);
    }
  };

  $('#btnSaveToken').onclick = async () => {
    const t = $('#cfgToken').value.trim();
    if (t.length < 4) { toast('口令至少 4 位'); return; }
    try {
      await api('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminToken: t })
      });
      localStorage.setItem('adminToken', t);
      $('#cfgToken').value = '';
      if (state.info) state.info.mustChangeToken = false;
      const notice = $('#tokenNotice'); if (notice) notice.remove();
      toast('后台口令已更新 (立即生效)');
    } catch (e) {
      toast('修改口令失败: ' + e.message);
    }
  };
  loadBootSlots();
}
async function loadBootSlots() {
  const list = $('#bootList');
  if (!list) return;
  try {
    const data = await api('/api/system/boot');
    if (!data || !data.systems) {
      list.innerHTML = '<div class="note">无法获取系统引导槽位信息</div>';
      return;
    }
    const current = data.current || 'audit';
    list.innerHTML = data.systems.map(s => {
      const isCur = (s.id === current) || s.active;
      const isInst = s.installed;
      let actionHtml = '';
      if (isCur) {
        actionHtml = '<button class="btn sm gray" disabled style="opacity:0.8">● 当前运行中</button>';
      } else if (isInst) {
        actionHtml = `<button class="btn sm" style="background:var(--yellow)" onclick="doSwitchBoot('${s.id}', '${s.name}', true)">[点击切换至] ${s.name}</button>`;
      } else {
        actionHtml = `<button class="btn sm gray" onclick="doSwitchBoot('${s.id}', '${s.name}', false)">[点击切换至] ${s.name} <small style="opacity:0.8">(需刷入)</small></button>`;
      }
      return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:var(--bd);border-radius:12px;background:${isCur ? 'var(--yellow)' : 'var(--cream)'};box-shadow:var(--sh2);flex-wrap:wrap;gap:10px">
        <div style="flex:1;min-width:200px">
          <div style="font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px">
            <span style="font-size:16px">${isCur ? '🔘' : '⚪'}</span>
            <span>${isCur ? '当前系统: ' : ''}<b>${s.name}</b></span>
            ${isCur ? '<span style="background:#111;color:var(--yellow);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px">活跃运行中</span>' : ''}
          </div>
          <div class="note" style="margin-top:4px">${s.desc} · <span class="mono">${s.partition} (${s.size || '--'})</span></div>
        </div>
        <div>${actionHtml}</div>
      </div>`;
    }).join('');
  } catch (e) {
    if (list) list.innerHTML = `<div class="note" style="color:#d33">加载多系统引导信息失败: ${e.message}</div>`;
  }
}

async function doSwitchBoot(id, name, installed) {
  let msg = `确定切换至【${name}】并重启设备？`;
  if (!installed) {
    msg = `【固件未就绪提示】\n目标分区 (${id}) 尚未检测到有效固件，切换后可能因镜像缺失而无法启动（需在烧录台先刷入对应分区）。\n\n是否仍然强制切换引导分区？`;
  }
  if (!confirm(msg)) return;
  try {
    toast(`正在切换引导至【${name}】并重启 …`);
    const r = await api('/api/system/boot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: id })
    });
    if (r && r.ok) {
      alert(`已成功设置引导分区为【${name}】！\n\n设备正在重启中，请留意板载指示灯并切换连接方式：\n- ESPsoup 模式：请使用 Native USB 数据线连接电脑/手机打开 app.espsoup.com\n- Muse AI 模式：请使用家庭 Wi-Fi 6 并在 Muse 手机端配对`);
      location.reload();
    }
  } catch (e) {
    toast('切换失败: ' + (e.message || e));
  }
}

async function doReboot() { await act('/api/reset', '确定重启设备？'); }
async function doFactory() { await act('/api/factory-reset', '确定恢复出厂设置？(清除配置并重启)'); }

/* ================== ticker ================== */
async function pollInfo() {
  try {
    const i = await api('/api/info');
    state.info = i;
    if (!state.target && i.target) state.target = i.target;
    // BLE 页按能力显示: 无 BLE 硬件 / 构建裁剪了 BLE 的芯片整页隐藏
    const bleChipOk = !(i.ble && i.ble.supported === false);
    ['#navBle', '#navBleSec'].forEach(sel => {
      const el = $(sel);
      if (el) el.style.display = bleChipOk ? '' : 'none';
    });
    if (!bleChipOk && location.hash === '#ble') { go('dash'); return; }
    // 802.15.4 页同理: 只有 C5/C6 有该射频
    const i154ChipOk = !(i.ieee802154 && i.ieee802154.supported === false);
    ['#navI154'].forEach(sel => {
      const el = $(sel);
      if (el) el.style.display = i154ChipOk ? '' : 'none';
    });
    if (!i154ChipOk && location.hash === '#ieee') { go('dash'); return; }
    $('#up').textContent = fmtUp(i.uptime);
    $('#memBar').style.width = (i.memUsedPct ?? 0) + '%';
    $('#memTxt').textContent = (i.memUsedPct ?? 0) + '%';
    
    // 如果在首页或双子页，刷新对应组件
    if (location.hash === '#dash' || location.hash === '' || location.hash === '#/') {
      if ($('#d1')) {
        $('#d1').textContent = fmtBytes(i.freeMem);
        $('#d2').textContent = fmtBytes(i.minFreeMem ?? 0);
        $('#d3').textContent = fmtBytes(i.maxBlock ?? 0);
        $('#d4').textContent = fragPct(i.freeMem, i.maxBlock) + '%';
      }
      renderTarget();
    }
  } catch (e) {}
}

async function pollModules() {
  try {
    // 轮询 Deauth 状态
    if (location.hash === '#deauth') {
      const d = await api('/api/deauth/status');
      state.deauthStatus = d;
      if ($('#deCount')) $('#deCount').textContent = d.count;
      if ($('#deStatusVal')) $('#deStatusVal').textContent = d.running ? 'ACTIVE' : 'IDLE';
      if ($('#deTxMode')) $('#deTxMode').textContent = deTxModeText(d);
    }
    // 轮询 BLE 扫描状态: 能力标记变化时整页重绘, 否则只定向刷新统计与列表
    if (location.hash === '#ble') {
      const b = await api('/api/ble/status');
      const supportChanged = (state.bleStatus.supported !== false) !== (b.supported !== false);
      state.bleStatus = b;
      if (supportChanged) renderBle(); else bleUpdate(b);
    }
    // 轮询 802.15.4 扫描状态: 同样按能力标记决定整页重绘或定向刷新
    if (location.hash === '#ieee') {
      const x = await api('/api/ieee802154/status');
      const supportChanged = (state.i154Status.supported !== false) !== (x.supported !== false);
      state.i154Status = x;
      if (supportChanged) renderI154(); else i154Update(x);
    }
    // 轮询 双子攻击 状态: 仅更新状态条与统计, 不重建整页
    if (location.hash === '#eviltwin' && state.info) etUpdateLive();
    // 轮询 Karma / 握手包 状态: 仅定向更新 DOM, 避免重构整页导致按钮与操作闪烁
    if (location.hash === '#handshake' || location.hash === '#karma') {
      const h = await api('/api/karma/status');
      state.handshakeStatus = h;
      state.karmaStatus = h;
      updateKarmaUI();
    }
    // 轮询 数据包分析器 状态
    if (location.hash === '#packet') {
      const s = await api('/api/sniffer/status');
      state.snifferStatus = s;
      updatePacketUI();
    }
    // 轮询 Airodump 侦察 状态
    if (location.hash === '#airodump') {
      const a = await api('/api/airodump/status');
      state.airodumpStatus = a;
      updateAirodumpUI();
    }
    // 轮询 捕获的凭据
    if (location.hash === '#creds') {
      const c = await api('/api/eviltwin/creds');
      state.creds = c.credentials || [];
      updateCredsUI();
    }
  } catch (e) {}
}

async function pollLog() {
  try {
    if (!adminToken()) return;
    const r = await fetch('/api/log?since=' + state.logId, { headers: { 'X-Admin-Token': adminToken() } });
    if (r.status === 401) { showLogin('口令已失效，请重新登录'); return; }
    const j = await r.json();
    if (j.entries && j.entries.length) {
      for (const e of j.entries) {
        if (e.id <= state.logId) continue;
        log(e.line);
        state.logId = e.id;
      }
    }
  } catch (e) {}
}

let booted = false;
async function boot() {
  if (booted) return;
  if (!adminToken()) { showLogin(); return; }
  try {
    await fetch('/api/info', { headers: { 'X-Admin-Token': adminToken() } }).then(r => {
      if (!r.ok) throw new Error(r.status === 401 ? 'unauthorized' : ('HTTP ' + r.status));
    });
  } catch (e) {
    if (String(e.message) === 'unauthorized') {
      localStorage.removeItem('adminToken');
      showLogin('口令错误，请重新输入');
      return;
    }
    // 其他网络错误: 继续尝试渲染, 后续轮询会自行恢复
  }
  booted = true;
  log('[SYSTEM] 无线网络安全教学与管理后台已连接');
  // 先取一次状态再渲染页面, 否则首屏的目标/双子列表会是空的 (要等 2s 轮询才补上)
  await pollInfo();
  const initialPage = ((location.hash || '').replace('#', '')) || 'dash';
  // 仍在使用出厂初始口令 → 直接落到配置页引导改密 (不硬阻断其余 API, 避免忘口令锁死设备)
  go(state.info && state.info.mustChangeToken ? 'cfg' : initialPage);
  pollLog();
  setInterval(pollInfo, 2000);
  setInterval(pollModules, 1000);
  setInterval(pollLog, 1500);
}
window.addEventListener('hashchange', () => {
  const p = location.hash.slice(1);
  if (!pages[p]) return;
  // go() 自己改的 hash: 页面已经渲染过; 只有用户手动改地址/前进后退才需要再渲染
  if (p === lastRoutedPage) return;
  go(p);
});
boot();
</script>
