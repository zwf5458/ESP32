; ESP32 无线网络开发固件 — 全芯片系列
; 编译: tools/build-firmware.sh [版本号]  (对每个 env 生成合并镜像并注册到后端)
; 注意: C5 需要较新的 espressif32 平台, 若官方版本尚不稳会标记失败 → 脚本跳过该芯片保留旧镜像

[platformio]
src_dir = src
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
; 版本与 AP 个性化入口
extra_scripts = pre:tools/embed_admin_page.py
build_flags =
    ; FW_VERSION 由 tools/build-firmware.sh 经 PLATFORMIO_BUILD_FLAGS 注入 (追加到本项之后);
    ; 直接 pio run 时由 main.cpp 的 #ifndef 提供兜底值 "1.1.0", 避免与注入值重复定义。
    -DFW_BUILD_NS=\"esp32-wireless-dev\"

[base_esp32]
extends = env
board_build.partitions = min_spiffs.csv

; ---------- 经典 ESP32 ----------
; BLE 裁剪: 该芯片的 BLE 走 Bluedroid, 比 NimBLE 多约 810KB(1.23MB→2.02MB), 与
; min_spiffs 的双 app 槽(三系统引导依赖)在 4MB Flash 上无法共存, 故关闭 BLE。
; 其余 C3/C5/C6/S3 走 NimBLE 且体积可控, 正常开放 BLE 扫描。
[env:esp32]
extends = base_esp32
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DFW_BLE_DISABLED

; ---------- ESP32-S2 ----------
[env:esp32s2]
extends = base_esp32
platform = espressif32
board = esp32-s2-saola-1

; ---------- ESP32-S3 ----------
[env:esp32s3]
extends = base_esp32
platform = espressif32
board = esp32-s3-devkitc-1

; ---------- ESP32-C3 ----------
[env:esp32c3]
extends = base_esp32
platform = espressif32
board = esp32-c3-devkitm-1

; ---------- ESP32-C6 ----------
; v8 平台 (arduino core 3.x) 原生支持 C6; 工具链与其它芯片共用 14.2.0+20260121
[env:esp32c6]
extends = base_esp32
platform = espressif32
board = esp32-c6-devkitc-1

; ---------- ESP32-C5 (实验性) ----------
; espressif32 v8 无 c5-libs 包 — 由 tools/install-c5-libs.sh 注入本地包:
; 源为 espressif/esp32-arduino-lib-builder idf-release_v5.5-b774170f (与 3.3.12 对应)
[env:esp32c5]
extends = base_esp32
platform = espressif32
board = esp32-c5-devkitc-1

; ---------- ESP32-C5 16MB 三系统 (Triple-Boot) ----------
; 仅用于 ESP32-C5N16R8 等 16MB Flash 板: ota_0/ota_1/ota_2 各 3.9375MB +
; 共享 4.0625MB spiffs。烧录台「多系统 / 外部固件刷写」的 0x400000 / 0x7F0000
; 偏移、固件 SYSTEM_SLOTS 与串口 `boot` 命令都依赖该分区表。
; 4MB 版 C5 继续用 [env:esp32c5] (min_spiffs)，两者镜像在烧录台里分开注册。
[env:esp32c5_16mb]
extends = env:esp32c5
board_build.partitions = partitions-16mb-triple.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
